[project]
name = "job-ai"
version = "0.1.0"
description = "AI Powered project to help revamp CV to suit Job description"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "arq>=0.26",
    "docling>=2.94.0",
    "fastapi>=0.115",
    "fpdf2>=2.8",
    "markdown>=3.8",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.47.0",
    "pydantic-settings>=2.0",
    "pydantic-xml>=2.18.0",
    "python-jose[cryptography]>=3.4",
    "redis>=5.0",
    "sentry-sdk[fastapi]>=2.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=25.0",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.34",
    "weasyprint>=65.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25",
    "python-dotenv>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/AgentFramework", "src/AgentService", "src/utils"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
